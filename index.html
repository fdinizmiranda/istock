<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iStock Apple Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style id="estilo">/* Visual no estilo Apple: fundo cinza claro, cartões brancos, azul do sistema, tipografia grande e justa, botões em pílula. */
:root {
  --bg: #F5F5F7;
  --card: #FFFFFF;
  --ink: #1D1D1F;
  --muted: #6E6E73;
  --line: #D2D2D7;
  --fill: #E8E8ED;
  --blue: #0071E3;
  --blue-hover: #0077ED;
  --blue-ink: #FFFFFF;
  --blue-soft: #E6F1FC;
  --danger: #D70015;
  --ok: #248A3D;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --card: #1C1C1E;
    --ink: #F5F5F7;
    --muted: #A1A1A6;
    --line: #38383A;
    --fill: #2C2C2E;
    --blue: #2997FF;
    --blue-hover: #47A5FF;
    --blue-ink: #FFFFFF;
    --blue-soft: #0C2438;
    --danger: #FF453A;
    --ok: #30D158;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000;
  --card: #1C1C1E;
  --ink: #F5F5F7;
  --muted: #A1A1A6;
  --line: #38383A;
  --fill: #2C2C2E;
  --blue: #2997FF;
  --blue-hover: #47A5FF;
  --blue-ink: #FFFFFF;
  --blue-soft: #0C2438;
  --danger: #FF453A;
  --ok: #30D158;
  color-scheme: dark;
}

:root { color-scheme: light; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.47;
  letter-spacing: -0.022em;
  -webkit-font-smoothing: antialiased;
  padding-block: 0 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, textarea, select { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

.wrap { max-width: 560px; margin-inline: auto; }
.wrap.wide { max-width: 920px; }

/* topo */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 18px 12px; min-width: 0; }
.brand { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.stepno { font-size: 14px; color: var(--muted); flex: none; }
.bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 36px; }
.bar i { height: 4px; border-radius: 4px; background: var(--fill); }
.bar i.on { background: var(--blue); }

/* telas */
.screen { display: grid; gap: 24px; }
.screen.enter { animation: rise .38s cubic-bezier(.2,.7,.2,1) both; }
.stack-s { display: grid; gap: 12px; }
[hidden] { display: none !important; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen.enter { animation: none; } * { transition: none !important; } }
h1 { margin: 0; font-size: clamp(32px, 9vw, 48px); line-height: 1.07; font-weight: 700; letter-spacing: -0.03em; text-wrap: balance; }
h2 { margin: 0; font-size: 21px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; }
.lead { margin: 0; font-size: 19px; line-height: 1.42; color: var(--muted); text-wrap: pretty; }
.cap { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: uppercase; color: var(--muted); }

/* campos */
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; color: var(--muted); font-weight: 500; }
.inp {
  width: 100%; min-height: 52px; padding: 12px 16px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  font-size: 17px;
}
.inp::placeholder { color: var(--muted); opacity: .8; }
.inp:focus { border-color: var(--blue); outline: 3px solid var(--blue-soft); outline-offset: 0; }
textarea.inp { min-height: 120px; resize: vertical; }

/* listas e opções */
.list { background: var(--card); border-radius: 18px; overflow: hidden; }
.opt {
  appearance: none; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  min-height: 58px; padding: 14px 18px; text-align: left;
  background: transparent; border: 0; border-bottom: 1px solid var(--line);
  font-size: 17px;
}
.list .opt:last-child { border-bottom: 0; }
.opt .sub { display: block; font-size: 14px; color: var(--muted); }
.opt[aria-checked="true"]::after { content: "\2713"; color: var(--blue); font-weight: 700; font-size: 20px; flex: none; }
.opt:hover { background: var(--fill); }

.cards { display: grid; gap: 10px; }
.cardopt {
  appearance: none; text-align: left; width: 100%;
  background: var(--card); border: 2px solid transparent; border-radius: 18px; padding: 16px 18px;
  display: grid; gap: 2px;
}
.cardopt b { font-weight: 600; font-size: 19px; }
.cardopt span { color: var(--muted); font-size: 15px; }
.cardopt[aria-checked="true"] { border-color: var(--blue); }

.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  appearance: none; border: 0; border-radius: 980px; padding: 11px 20px; min-height: 44px;
  background: var(--card); font-weight: 500;
}
.pill small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.pill[aria-checked="true"] { background: var(--blue); color: var(--blue-ink); }
.pill[aria-checked="true"] small { color: var(--blue-ink); opacity: .85; }

.sw-row {
  appearance: none; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 14px;
  min-height: 58px; padding: 12px 18px; text-align: left;
  background: transparent; border: 0; border-bottom: 1px solid var(--line);
}
.list .sw-row:last-child { border-bottom: 0; }
.sw { position: relative; flex: none; width: 51px; height: 31px; border-radius: 31px; background: var(--fill); transition: background-color .2s ease; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.25); transition: transform .2s ease; }
.sw-row[aria-checked="true"] .sw { background: var(--ok); }
.sw-row[aria-checked="true"] .sw::after { transform: translateX(20px); }
.sw-row .desc { display: block; font-size: 14px; color: var(--muted); }

/* botões */
.actions { display: grid; gap: 10px; margin-top: 4px; }
.btn {
  appearance: none; display: inline-flex; justify-content: center; align-items: center; text-align: center;
  width: 100%; min-height: 52px; padding: 0 28px; border: 0; border-radius: 980px;
  background: var(--blue); color: var(--blue-ink); font-size: 17px; font-weight: 600; text-decoration: none;
  transition: background-color .15s ease, opacity .15s ease;
}
.btn:hover { background: var(--blue-hover); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .35; cursor: not-allowed; }
.btn.alt { background: var(--fill); color: var(--blue); }
.link { appearance: none; background: none; border: 0; color: var(--blue); font-size: 17px; padding: 10px; min-height: 44px; text-align: center; }
.note { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted); text-align: center; text-wrap: pretty; }
.err { color: var(--danger); }

/* resultado */
.big { font-size: clamp(60px, 19vw, 96px); font-weight: 700; letter-spacing: -0.045em; line-height: 1; font-variant-numeric: tabular-nums; }
.hero { display: grid; gap: 10px; }
.rcpt { background: var(--card); border-radius: 18px; padding: 6px 18px; font-variant-numeric: tabular-nums; }
.rcpt .r { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.rcpt .r:last-child { border-bottom: 0; }
.rcpt .r span:first-child { color: var(--muted); }
.rcpt .r span:last-child { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
.rcpt .r.sum span:first-child { color: var(--ink); font-weight: 600; }
.rcpt .sub { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }

.fine { margin-top: 36px; text-align: center; font-size: 13px; color: var(--muted); }
.fine a { color: var(--muted); }

/* administração */
.ahead { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; padding-block: 28px 8px; }
.ahead h1 { font-size: clamp(28px, 7vw, 40px); }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px; background: var(--fill); border-radius: 12px; margin-block: 16px 20px; }
.tab { appearance: none; border: 0; background: transparent; padding: 9px 16px; border-radius: 9px; white-space: nowrap; font-size: 15px; font-weight: 500; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.stack { display: grid; gap: 14px; }
.acard { background: var(--card); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.arow { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; min-width: 0; }
.arow .grow { flex: 1 1 200px; min-width: 0; }
.arow .num { flex: 0 1 130px; min-width: 0; }
.afield { display: grid; gap: 4px; min-width: 0; }
.afield > span { font-size: 12px; color: var(--muted); font-weight: 500; }
.acard .inp { min-height: 44px; padding: 8px 12px; border-radius: 10px; }
.btn-s { appearance: none; border: 0; border-radius: 980px; padding: 9px 16px; min-height: 40px; background: var(--fill); color: var(--blue); font-size: 15px; font-weight: 500; }
.btn-s:hover { background: var(--blue-soft); }
.btn-s.danger { color: var(--danger); }
.btn-s.solid { background: var(--blue); color: var(--blue-ink); }
.btn-s.solid:hover { background: var(--blue-hover); }
.btn-s[disabled] { opacity: .4; cursor: not-allowed; }
.pubbar {
  position: sticky; bottom: 12px; z-index: 5; margin-top: 24px;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px;
  box-shadow: 0 6px 24px rgba(0,0,0,.12);
}
.pubbar .st { font-size: 15px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.pubbar .st.dirty { color: var(--ink); font-weight: 500; }
.tablewrap { overflow-x: auto; background: var(--card); border-radius: 16px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 760px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.warn { background: var(--blue-soft); border-radius: 12px; padding: 12px 14px; font-size: 15px; }

/* ilustração, cores e parcelas */
.opt.var { justify-content: flex-start; gap: 14px; }
.opt.var .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .price { font-variant-numeric: tabular-nums; font-weight: 600; flex: none; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(128,128,128,.45); flex: none; }
select.inp { appearance: auto; }
.asub { display: grid; gap: 10px; padding: 12px; background: var(--soft, var(--fill)); border-radius: 12px; min-width: 0; }
.arow.vrow { align-items: flex-end; }
.afield.tom { flex: 0 0 64px; }
.colorpick { width: 56px; height: 44px; padding: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); cursor: pointer; }
.feegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }

/* fotos, logo, aparência, acesso */
.photo-box { display: flex; flex-direction: column; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 22px; padding: 16px 16px 12px; }
.photo { max-height: 230px; max-width: 100%; object-fit: contain; }
.photo-cap { margin: 0; font-size: 13px; color: #6E6E73; text-align: center; }
.brand-wrap { min-width: 0; }
img.logo { display: block; max-height: 34px; max-width: 200px; width: auto; object-fit: contain; }
.ahead img.logo { max-height: 40px; margin-bottom: 6px; }
.banner { margin-top: 12px; padding: 10px 14px; border-radius: 12px; background: var(--blue-soft); font-size: 14px; }
.banner a { color: var(--blue); font-weight: 600; }
.imgctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.thumb { width: 56px; height: 56px; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 10px; flex: none; }
.thumb.logo { width: 96px; height: 40px; }
.filebtn { position: relative; cursor: pointer; display: inline-flex; align-items: center; }
.filein { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
.filebtn:focus-within { outline: 3px solid var(--blue); outline-offset: 2px; }
.presets { display: flex; flex-wrap: wrap; gap: 10px; }
.preset { width: 38px; height: 38px; border-radius: 50%; border: 2px solid transparent; box-shadow: 0 0 0 1px rgba(128,128,128,.45); cursor: pointer; }
.preset[aria-pressed="true"] { border-color: var(--card); box-shadow: 0 0 0 3px var(--blue); }
form.screen { margin: 0; }
</style>

  function parseLeads(text) {
    var parts = String(text || "").split(/Novo or[çc]amento de troca/i);
    parts.shift();
    var out = [];
    parts.forEach(function (block) {
      function f(label) {
        var m = block.match(new RegExp("(?:^|\\n)[ \\t]*\\**" + label + ":[ \\t]*([^\\n\\r]*)", "i"));
        return m ? m[1].replace(/\*/g, "").trim() : "";
      }
      function num(s) { var d = digits(s); return d ? parseInt(d, 10) : null; }
      var cliente = f("Cliente"), whats = f("WhatsApp");
      if (!cliente && !whats) return;
      var data = f("Data");
      var ts = Date.now();
      var m = data.match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
      if (m) ts = new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5]).getTime();
      out.push({
        id: "l_" + (digits(whats) || "x") + "_" + ts,
        ts: ts, cliente: cliente, whatsapp: whats, aparelho: f("Aparelho"), bateria: f("Bateria"), caixa: f("Caixa"),
        descricao: f("Descrição do defeito"), quer: f("Quer"), pagamento: f("Pagamento"),
        avaliacao: num(f("Avaliação do aparelho")), diferenca: num(f("Diferença"))
      });
    });
    return out;
  }

    var lines = [head.map(csvCell).join(";")];
    rows.forEach(function (r) {
      lines.push([stamp(new Date(r.ts || 0)), r.cliente, r.whatsapp, r.aparelho, r.bateria, r.caixa, r.descricao, r.quer, r.pagamento, r.avaliacao, r.diferenca].map(csvCell).join(";"));
    });
    return lines.join("\r\n");

            A.confirmTimer = setTimeout(function () { A.confirmId = null; drawLeads(); }, 3500);
            drawLeads(); return;
          }
          A.confirmId = null;
          A.leads = A.leads.filter(function (x) { return x.id !== r.id; });
          saveLeads(); drawLeads();
        }
      });
      tbody.appendChild(h("tr", {},
        h("td", { class: "n", text: stamp(new Date(r.ts || 0)) }),
        h("td", { text: r.cliente || "" }),
        h("td", { class: "n" }, wn ? h("a", { href: "https://wa.me/" + wn, target: "_blank", rel: "noopener", text: r.whatsapp }) : (r.whatsapp || "")),
        h("td", { text: (r.aparelho || "") + (r.bateria ? " · " + r.bateria : "") + (r.descricao ? " · " + r.descricao : "") }),
        h("td", { text: r.quer || "" }),
        h("td", { text: r.pagamento || "" }),
        h("td", { class: "n", text: r.diferenca === null || r.diferenca === undefined ? "" : money(r.diferenca) }),
        h("td", {}, del)));
    });
    host.appendChild(h("div", { class: "tablewrap" }, h("table", {},
      h("thead", {}, h("tr", {},
        ["Data", "Cliente", "WhatsApp", "Aparelho", "Quer", "Pagamento", "Diferença", ""].map(function (t) { return h("th", { text: t }); }))),
      tbody)));
  }

  function cadastrosPanel() {
    var info = h("p", { class: "lead", text: "Quando o cliente toca em enviar, o cadastro chega no seu WhatsApp. Copie as mensagens recebidas, cole aqui e a lista fica organizada, pronta para virar planilha." });
    var aviso = h("p", { class: "note", style: "text-align:left", text: "Esta lista fica salva só neste navegador. Baixe a planilha de vez em quando para guardar uma cópia." });
    var ta = h("textarea", { class: "inp", id: "paste", placeholder: "Cole aqui uma ou várias mensagens “Novo orçamento de troca”", "aria-label": "Mensagens do WhatsApp" });
    var msg = h("p", { class: "note", style: "text-align:left", text: "" });
    var addBtn = sbtn("Adicionar à lista", "solid", function () {
      var items = parseLeads(ta.value);
      if (!items.length) { msg.className = "note err"; msg.textContent = "Não encontrei nenhuma mensagem de orçamento nesse texto."; return; }
      var ids = {};
      A.leads.forEach(function (x) { ids[x.id] = true; });
      var novos = items.filter(function (x) { return !ids[x.id]; });
      A.leads = A.leads.concat(novos).sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
      var ok = saveLeads();
      msg.className = ok ? "note" : "note err";
      msg.textContent = ok ? (novos.length + (novos.length === 1 ? " cadastro adicionado." : " cadastros adicionados.") + (items.length > novos.length ? " " + (items.length - novos.length) + " já estavam na lista." : "")) : "Não consegui guardar a lista neste navegador. Baixe a planilha agora.";
      ta.value = "";
      drawLeads();
    });
    var csvBtn = sbtn("Baixar planilha (CSV)", "", async function () {
      if (!A.leads.length) { msg.className = "note err"; msg.textContent = "Não há cadastros para baixar ainda."; return; }
      var res = await baixar("cadastros-troca.csv", "﻿" + toCsv(A.leads), "text/csv");
      if (res === "ok") { msg.className = "note"; msg.textContent = "Planilha pronta. Abra no Excel ou no Google Planilhas."; }
      else if (res === "erro") { msg.className = "note err"; msg.textContent = "Não foi possível baixar agora."; }
    });
    A.tableHost = h("div");
    var panel = h("div", { class: "stack" }, info, aviso, ta, h("div", { class: "arow" }, addBtn, csvBtn), msg, A.tableHost);
    drawLeads();
    return panel;
  }

  var TABS = [
    { id: "usados", label: "Aparelhos usados" },
    { id: "novos", label: "iPhones novos" },
    { id: "regras", label: "Regras" },
    { id: "parcelas", label: "Parcelamento" },
    { id: "aparencia", label: "Aparência" },
    { id: "loja", label: "Loja" },
    { id: "cadastros", label: "Cadastros" },
    { id: "conta", label: "Conta" }
  ];

  function drawPanel() {
    if (!A.host) return;
    var p;
    A.tableHost = null;
    if (A.tab === "usados") p = usadosPanel();
    else if (A.tab === "novos") p = novosPanel();
    else if (A.tab === "regras") p = regrasPanel();
    else if (A.tab === "parcelas") p = parcelasPanel();
    else if (A.tab === "aparencia") p = aparenciaPanel();
    else if (A.tab === "loja") p = lojaPanel();
    else if (A.tab === "conta") p = contaPanel();
    else p = cadastrosPanel();
    A.host.replaceChildren(p);
  }

  function validate() {
    var c = catalog, i, j, k, m, a;
    if (!c.usados.length) return "Cadastre ao menos um aparelho usado.";
    if (!c.novos.length) return "Cadastre ao menos um iPhone novo.";
    for (i = 0; i < c.usados.length; i++) {
      m = c.usados[i];
      if (!String(m.nome).trim()) return "Dê um nome a todos os aparelhos usados.";
      if (!m.armazenamentos.length) return m.nome + " precisa de ao menos uma capacidade.";
      if (!(m.bateriaMin >= 1 && m.bateriaMin <= 100)) return "A bateria mínima de " + m.nome + " deve ficar entre 1 e 100.";
      for (j = 0; j < m.armazenamentos.length; j++) {
        a = m.armazenamentos[j];
        if (!(a.gb > 0)) return "Informe a capacidade em GB de " + m.nome + ".";
        if (!(a.valor > 0)) return "Informe o valor de " + m.nome + " " + gbLabel(a.gb) + ".";
      }
    }
    for (i = 0; i < c.novos.length; i++) {
      m = c.novos[i];
      if (!String(m.nome).trim()) return "Dê um nome a todos os iPhones novos.";
      if (!m.armazenamentos.length) return m.nome + " precisa de ao menos uma capacidade.";
      for (j = 0; j < m.armazenamentos.length; j++) {
        a = m.armazenamentos[j];
        if (!(a.gb > 0)) return "Informe a capacidade em GB de " + m.nome + ".";
        if (!a.variantes.length) return m.nome + " " + gbLabel(a.gb) + " precisa de ao menos uma cor.";
        for (k = 0; k < a.variantes.length; k++) {
          if (!String(a.variantes[k].cor).trim()) return "Dê um nome a todas as cores de " + m.nome + ".";
          if (!(a.variantes[k].preco > 0)) return "Informe o preço de " + m.nome + " " + gbLabel(a.gb) + " " + a.variantes[k].cor + ".";
        }
      }
    }
    for (i = 0; i < c.individuais.length; i++) if (!String(c.individuais[i]).trim()) return "Preencha ou remova os itens de avaliação individual.";
    var p = c.parcelas;
    if (!(p.taxaVenda >= 0 && p.taxaVenda < 30)) return "A taxa de venda deve ficar entre 0 e 30%.";
    for (i = 0; i < p.taxas.length; i++) if (!(p.taxas[i] >= 0 && p.taxas[i] < 60)) return "Confira a taxa da parcela " + (i + 1) + "x.";
    if (!(p.ate >= 1 && p.ate <= p.taxas.length)) return "Escolha até quantas parcelas mostrar.";
    return "";
  }

  function normalize() {
    var c = catalog;
    c.usados.forEach(function (m) {
      m.nome = m.nome.trim(); m.grupo = (m.grupo || "").trim() || m.nome;
      m.armazenamentos.sort(function (x, y) { return x.gb - y.gb; });
    });
    c.novos.forEach(function (m) {
      m.nome = m.nome.trim();
      m.armazenamentos.sort(function (x, y) { return x.gb - y.gb; });
      m.armazenamentos.forEach(function (a) {
        a.variantes.forEach(function (x) { x.cor = x.cor.trim(); x.detalhe = (x.detalhe || "").trim(); if (!x.id) x.id = uid("v"); });
      });
    });
    c.individuais = c.individuais.map(function (s) { return String(s).trim(); });
    c.loja.nome = (c.loja.nome || "").trim();
    c.loja.whatsapp = digits(c.loja.whatsapp);
    c.loja.aviso = (c.loja.aviso || "").trim();
    c.loja.avisoPreco = (c.loja.avisoPreco || "").trim();
    c.loja.atualizadoEm = isoDay(new Date());
  }

  async function exportar() {
    var err = validate();
    if (err) { setStatus(err, true); return; }
    normalize();
    catalog.versao = Date.now();
    A.barBtn.disabled = true;
    setStatus("Gerando o arquivo…", false);
    var res = await baixar("index.html", buildFile(catalog), "text/html");
    saveDraft();
    if (res === "ok") setStatus("Arquivo index.html baixado. Envie para o seu provedor, no lugar do arquivo antigo.", false);
    else if (res === "cancelado") setStatus("Download cancelado.", false);
    else setStatus("Não foi possível baixar o arquivo agora.", true);
    A.barBtn.disabled = !isDirty();
  }

  function descartar() {
    if (!A.discConfirm) { A.discConfirm = true; updateBar(); return; }
    catalog = JSON.parse(EMBED);
    sdel(window.localStorage, KEY_DRAFT);
    A.discConfirm = false;
    applyAppearance();
    setStatus("Alterações descartadas.", false);
    renderPanel();
  }

  function sair() {
    sdel(window.sessionStorage, KEY_SESSION);
    catalog = JSON.parse(EMBED);
    applyAppearance();
    location.hash = "";
    route();
  }

  /* telas de acesso */

  function renderLogin() {
    var msg = h("p", { class: "note err", role: "alert", style: "text-align:left" });
    var user = h("input", { class: "inp", id: "l-user", type: "text", autocomplete: "username", value: embedAcesso.usuario, autocapitalize: "none" });
    var pass = h("input", { class: "inp", id: "l-pass", type: "password", autocomplete: "current-password" });
    var btn = h("button", { class: "btn", type: "submit", text: "Entrar" });
    var form = h("form", { class: "screen enter", novalidate: true },
      h("h1", { text: "Administração" }),
      h("p", { class: "lead", text: "Entre com o seu usuário e a sua senha." }),
      field("Usuário", "l-user", user), field("Senha", "l-pass", pass),
      h("div", { class: "actions" }, btn, msg, h("a", { class: "link", href: "#", text: "Voltar ao site" })));
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var agora = Date.now();
      if (agora < A.bloqueioAte) { msg.textContent = "Muitas tentativas. Aguarde " + Math.ceil((A.bloqueioAte - agora) / 1000) + " segundos."; return; }
      btn.disabled = true; msg.textContent = "";
      setTimeout(function () {
        var ok = senhaOk(user.value, pass.value, embedAcesso);
        btn.disabled = false;
        if (!ok) {
          A.falhas++;
          if (A.falhas >= 5) { A.falhas = 0; A.bloqueioAte = Date.now() + 30000; msg.textContent = "Muitas tentativas. Aguarde 30 segundos."; }
          else msg.textContent = "Usuário ou senha incorretos.";
          pass.value = ""; pass.focus();
          return;
        }
        A.falhas = 0;
        sset(window.sessionStorage, KEY_SESSION, "1");
        loadDraft();
        applyAppearance();
        if (catalog.acesso.trocar) renderTrocar(); else renderPanel();
      }, 30);
    });
    root.replaceChildren(h("div", { class: "wrap" }, h("div", { class: "top" }, brandNode()), form));
    user.focus();
  }

  function renderTrocar() {
    var msg = h("p", { class: "note err", role: "alert", style: "text-align:left" });
    var user = h("input", { class: "inp", id: "t-user", type: "text", autocomplete: "username", value: catalog.acesso.usuario });
    var n1 = h("input", { class: "inp", id: "t-n1", type: "password", autocomplete: "new-password" });
    var n2 = h("input", { class: "inp", id: "t-n2", type: "password", autocomplete: "new-password" });
    var btn = h("button", { class: "btn", type: "submit", text: "Salvar e entrar" });
    var form = h("form", { class: "screen enter", novalidate: true },
      h("h1", { text: "Crie a sua senha" }),
      h("p", { class: "lead", text: "Você entrou com a senha provisória. Defina uma senha só sua antes de continuar." }),
      field("Usuário", "t-user", user), field("Nova senha (mínimo 8 caracteres)", "t-n1", n1), field("Repetir a nova senha", "t-n2", n2),
      h("div", { class: "actions" }, btn, msg,
        h("p", { class: "note", text: "A nova senha passa a valer no site depois que você baixar o site atualizado e enviar ao provedor." })));
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!user.value.trim()) { msg.textContent = "Informe o usuário."; return; }
      if (n1.value.length < 8) { msg.textContent = "A senha precisa ter pelo menos 8 caracteres."; return; }
      if (n1.value !== n2.value) { msg.textContent = "As duas senhas não são iguais."; return; }
      btn.disabled = true; msg.textContent = "";
      setTimeout(function () {
        catalog.acesso = novoAcesso(user.value, n1.value);
        saveDraft();
        renderPanel();
      }, 30);
    });
    root.replaceChildren(h("div", { class: "wrap" }, h("div", { class: "top" }, brandNode()), form));
    n1.focus();
  }

  function renderPanel() {
    A.leads = loadLeads().sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
    A.host = h("div");
    A.barSt = h("div", { class: "st", role: "status" });
    A.barBtn = h("button", { class: "btn-s solid", type: "button", text: "Baixar site atualizado", onclick: exportar });
    A.discBtn = h("button", { class: "btn-s", type: "button", text: "Descartar alterações", onclick: descartar });
    var tabs = h("div", { class: "tabs", role: "tablist" });
    TABS.forEach(function (t) {
      tabs.appendChild(h("button", {
        class: "tab", type: "button", role: "tab", "aria-selected": String(A.tab === t.id), text: t.label,
        onclick: function () {
          A.tab = t.id;
          Array.prototype.forEach.call(tabs.children, function (b, i) { b.setAttribute("aria-selected", String(TABS[i].id === A.tab)); });
          drawPanel();
        }
      }));
    });
    root.replaceChildren(h("div", { class: "wrap wide" },
      h("div", { class: "ahead" },
        h("div", {}, brandNode(), h("h1", { text: "Administração" })),
        h("div", { class: "arow" },
          h("a", { class: "btn-s", href: "#", text: "Ver o site", style: "text-decoration:none;display:inline-flex;align-items:center" }),
          sbtn("Sair", "", sair))),
      tabs, A.host,
      h("div", { class: "pubbar" }, A.barSt, h("div", { class: "arow" }, A.discBtn, A.barBtn))));
    drawPanel();
    updateBar();
  }

  function route() {
    if (location.hash === "#admin") {
      if (isAdmin()) {
        loadDraft(); applyAppearance();
        if (catalog.acesso.trocar) renderTrocar(); else renderPanel();
      } else renderLogin();
    } else {
      if (isAdmin()) loadDraft();
      applyAppearance();
      animateNext = true; renderSite(); window.scrollTo(0, 0);
    }
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
